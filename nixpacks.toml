[phases.setup]
aptPkgs = [
  "libgl1",
  "libglib2.0-0",
  "libsm6",
  "libxext6",
  "libxrender1",
  "libx11-6",
  "libxcb1",
  "ffmpeg"
]

[phases.install]
cmds = [
  "pip uninstall -y opencv-python opencv-contrib-python || true",
  "pip install --no-cache-dir opencv-python-headless opencv-contrib-python-headless"
]
